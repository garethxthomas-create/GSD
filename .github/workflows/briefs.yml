name: GSD briefs

on:
  schedule:
    # UTC, off-peak minutes (GitHub delays :00 badly). Ashburn is UTC-4 in summer.
    - cron: "37 11 * * *"   # ~7:37am EDT — morning brief
    - cron: "47 18 * * *"   # ~2:47pm EDT — midday check-in
    - cron: "47 20 * * *"   # ~4:47pm EDT — evening review
  workflow_dispatch:
    inputs:
      mode:
        description: "Which brief to run"
        type: choice
        options: [morning, midday, evening]
        default: morning

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate brief and send push
        id: brief
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          MODE: ${{ github.event.inputs.mode }}
        run: node scripts/brief.mjs

      - name: Email the brief
        if: env.GMAIL_ADDRESS != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: GSD
          to: ${{ secrets.GMAIL_ADDRESS }}
          subject: ${{ steps.brief.outputs.subject }}
          body: file://brief_out.md
